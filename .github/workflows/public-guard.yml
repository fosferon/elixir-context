name: public-guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    # A branch-deletion push publishes nothing, so there is nothing to scan
    # (the pre-push hook skips deletions the same way).
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    env:
      # When extras are required, defined once for both guard steps. The secret
      # itself is passed only to the steps that read it, never to third-party
      # actions. Secrets are absent on pull requests from forks; there the
      # built-in patterns still run, and the push to the default branch
      # (master) afterwards runs the full set. Fork pushes need no extras;
      # canonical pushes do under any owner or name. Dependabot runs receive
      # no secrets, so they use the built-in patterns only.
      PUBLIC_GUARD_REQUIRE_EXTRA: ${{ ((github.event_name == 'push' && !github.event.repository.fork) || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard fixture test
        run: bash scripts/public_guard_test.sh
      - name: Content guard
        env:
          PUBLIC_GUARD_EXTRA: ${{ secrets.PUBLIC_GUARD_EXTRA }}
        run: bash scripts/public_guard.sh
      - name: Content guard (pushed range)
        env:
          PUBLIC_GUARD_EXTRA: ${{ secrets.PUBLIC_GUARD_EXTRA }}
        run: |
          set -euo pipefail
          # Make sure every existing origin branch is present locally; a known
          # base is then range-scanned. The hook and CI share this script so
          # they cannot drift, even though their fallbacks differ.
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            bash scripts/public_guard_push_range.sh origin "$base" "$head"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            # CI runs after the push, so --ci scans the whole history when the
            # base is unusable (new branch or force-push) instead of excluding
            # the just-pushed branch and scanning nothing.
            bash scripts/public_guard_push_range.sh --ci origin "$base" "$head"
          fi
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
